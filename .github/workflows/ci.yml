name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

  # Row level security is only meaningful if it is exercised against a real
  # PostgreSQL. This job is the proof; the assertion at the end makes sure a
  # skipped suite can never be mistaken for a passing one.
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finance_hub
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://finance:finance_dev_password@localhost:5432/finance_hub
      RLS_TEST_DATABASE_URL: postgresql://finance:finance_dev_password@localhost:5432/finance_hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Isolation tests
        run: corepack pnpm exec vitest run packages/db/test/rls.integration.test.ts packages/db/test/user-context.integration.test.ts 2>&1 | tee rls.log

      - name: Fail if isolation was not actually verified
        run: |
          if grep -q "is NOT verified" rls.log; then
            echo "::error::Isolation tests skipped — isolation was not verified."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finance_hub
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://finance:finance_dev_password@localhost:5432/finance_hub
      PLAYWRIGHT_AUTH_DATABASE_URL: postgresql://finance:finance_dev_password@localhost:5432/finance_hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: corepack pnpm db:migrate

      - name: Seed catalogue
        run: corepack pnpm db:seed
        env:
          FINANCE_HUB_USE_DATABASE: "true"

      - name: Build
        run: corepack pnpm build

      # Runs three projects: seeded (accounts off), public demo, and the
      # database-backed `authenticated` project that covers the real auth flow.
      - name: Smoke and auth tests
        run: corepack pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
